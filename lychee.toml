exclude = [
  "(^|/)assets/(product|registry)\\.css$",
  "(^|/)openapi\\.json$",
  # Signing identities are compared by Cosign, not fetched as documentation pages.
  "^https://github\\.com/\\$GITHUB_WORKFLOW_REF$",
  "^https://token\\.actions\\.githubusercontent\\.com/?$",
  # This fixture-only loopback route is exercised inside its container by probes.
  "^http://127\\.0\\.0\\.1:9000/healthz$",
]

# The central registry's root-relative assets are runtime routes served by its Go handler, not files
# beside the embedded HTML. Handler and browser tests cover those routes directly.
exclude_path = ["internal/registry/ui/index\\.html"]

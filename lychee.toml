# Verify the same source files through their raw endpoints: GitHub's file-page renderer
# returns HTTP 503 to hosted link checks. Keep the pinned ArangoDB commit and file path;
# the Kubernetes alias resolves to this same community/main document. Missing files fail.
remap = [
  '^https://git\.k8s\.io/community/(contributors/devel/sig-architecture/api-conventions\.md)(#.*)?$ https://raw.githubusercontent.com/kubernetes/community/main/$1$2',
  '^https://github\.com/arangodb/kube-arangodb/blob/([0-9a-f]{40})/(pkg/apis/deployment/v1/[a-z_]+\.go)(#L[0-9]+)?$ https://raw.githubusercontent.com/arangodb/kube-arangodb/$1/$2$3',
]

exclude = [
  "(^|/)assets/(product|registry)\\.css$",
  "(^|/)openapi\\.json$",
  # This Go API route is exercised by handler and browser tests, not a local file.
  "(^|/)api/observations$",
  # Signing identities are compared by Cosign, not fetched as documentation pages.
  "^https://github\\.com/\\$GITHUB_WORKFLOW_REF$",
  "^https://github\\.com/\\$SIGNING_WORKFLOW$",
  "^https://github\\.com/devantler-tech/actions/\\.github/workflows/publish-app\\.yaml@[0-9a-f]{40}$",
  "^https://token\\.actions\\.githubusercontent\\.com/?$",
  # This fixture-only loopback route is exercised inside its container by probes.
  "^http://127\\.0\\.0\\.1:9000/healthz$",
]

# The central registry's root-relative assets are runtime routes served by its Go handler, not files
# beside the embedded HTML. Handler and browser tests cover those routes directly.
exclude_path = ["internal/registry/ui/index\\.html"]

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Find data products, inspect their interfaces, and query their data."
    />
    <title>Data products</title>
    <link rel="stylesheet" href="/assets/registry.css" />
  </head>
  <body>
    <a class="skip-link" href="#products">Skip to products</a>
    <header class="masthead">
      <h1>Data products</h1>
      <div class="workspace-actions">
        <div class="appearance">
          <label for="appearance">Theme</label>
          <select id="appearance" aria-label="Theme">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
        <button id="refresh-products" type="button">Refresh products</button>
      </div>
    </header>
    <main class="workspace" id="products">
      <section class="catalog-panel" aria-labelledby="products-title">
        <div class="section-heading">
          <h2 id="products-title">Products</h2>
          <p id="product-count" aria-live="polite">Loading…</p>
        </div>
        <div class="filters">
          <label for="product-search">Search products</label>
          <input
            id="product-search"
            type="search"
            placeholder="Name, owner or keyword"
            autocomplete="off"
          />
          <label for="readiness-filter">Readiness</label>
          <select id="readiness-filter">
            <option value="all">All products</option>
            <option value="ready">Ready</option>
            <option value="unready">Not ready</option>
          </select>
        </div>
        <p id="registry-status" class="status" role="status">
          Loading products…
        </p>
        <button id="clear-filters" class="text-button" type="button" hidden>
          Clear filters
        </button>
        <div id="data-product-grid" class="product-grid"></div>
        <noscript
          >Enable JavaScript to browse products. The product list is also
          available at
          <a href="/api/v1/products">the registry API</a>.</noscript
        >
      </section>
      <section class="interaction-panel" aria-labelledby="interaction-title">
        <div class="interaction-copy">
          <h2 id="interaction-title" tabindex="-1">Select a product</h2>
          <p id="interaction-description">
            Choose a product to view its details and data.
          </p>
          <dl id="product-metadata" hidden>
            <div>
              <dt>Owner</dt>
              <dd id="product-owner"></dd>
            </div>
            <div>
              <dt>Version</dt>
              <dd id="product-version"></dd>
            </div>
            <div>
              <dt>Namespace</dt>
              <dd id="product-namespace"></dd>
            </div>
            <div>
              <dt>Readiness</dt>
              <dd id="product-readiness"></dd>
            </div>
          </dl>
          <p id="readiness-detail" hidden></p>
          <section
            id="interfaces-detail"
            aria-labelledby="interfaces-title"
            hidden
          >
            <h3 id="interfaces-title">Data interfaces</h3>
            <ul id="product-interfaces"></ul>
          </section>
          <section
            id="composition-detail"
            aria-labelledby="composition-title"
            hidden
          >
            <h3 id="composition-title">Inputs and lineage</h3>
            <p id="composition-status" role="status"></p>
            <ul id="product-lineage"></ul>
          </section>
          <p
            id="ui-contract-status"
            role="status"
            aria-live="polite"
            hidden
          ></p>
        </div>
        <iframe
          id="product-surface"
          title="Selected data product"
          sandbox="allow-forms allow-scripts"
          referrerpolicy="no-referrer"
          hidden
        ></iframe>
        <div id="surface-empty" class="surface-empty" hidden>
          <p>No product view is open.</p>
        </div>
      </section>
    </main>
    <script src="/assets/ui-contract.js" defer></script>
    <script src="/assets/registry.js" defer></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Temperature and salinity observations from Copenhagen harbour."
    />
    <title>Harbour observations</title>
    <link rel="stylesheet" href="assets/product.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Harbour observations</h1>
        <p>Temperature and salinity at two Copenhagen stations.</p>
      </header>
      <p class="sample-note">
        Synthetic sample data. These values are fixed examples, not live
        measurements.
      </p>
      <form id="query-form">
        <div class="station-field">
          <label for="station">Station</label>
          <select id="station" name="station">
            <option value="">All stations</option>
            <option value="nordhavn">Nordhavn</option>
            <option value="refshaleoen">Refshaleoen</option>
          </select>
        </div>
        <button type="submit">Load observations</button>
      </form>
      <p id="status" role="status" aria-live="polite">Loading observations…</p>
      <section id="observations" aria-label="Query results"></section>
      <nav aria-label="Data access">
        <a href="api/observations" target="_blank" rel="noopener noreferrer"
          >Open JSON data</a
        >
        <a href="openapi.json" target="_blank" rel="noopener noreferrer"
          >View API contract</a
        >
      </nav>
    </main>
    <script src="assets/product.js" defer></script>
  </body>
</html>

apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: khoist-documentation
  namespace: data-product-controller
spec:
  endpoints:
    - dnsName: khoist.devantler.tech
      recordType: CNAME
      recordTTL: 300
      targets:
        - devantler-tech.github.io
      providerSpecific:
        - name: cloudflare/proxied
          value: "false"

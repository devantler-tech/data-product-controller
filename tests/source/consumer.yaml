apiVersion: v1
kind: Pod
metadata:
  name: consumer
  namespace: products
  annotations:
    checkov.io/skip1: CKV_K8S_43=The harness replaces this local build tag with its verified pushed digest before applying either consumer.
  labels:
    app: source-consumer
    app.kubernetes.io/component: source-test-consumer
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: consumer
      image: localhost:5055/source-fixture:e2e
      imagePullPolicy: Always
      command: [/fixture, idle]
      readinessProbe:
        exec:
          command:
            [
              /fixture,
              probe,
              --url,
              "http://127.0.0.1:9000/healthz",
              --timeout,
              3s,
            ]
        timeoutSeconds: 5
      livenessProbe:
        exec:
          command:
            [
              /fixture,
              probe,
              --url,
              "http://127.0.0.1:9000/healthz",
              --timeout,
              3s,
            ]
        timeoutSeconds: 5
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: source-test-consumers
  namespace: products
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: source-test-consumer
  policyTypes: [Ingress]
  ingress: []

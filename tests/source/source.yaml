apiVersion: v1
kind: Service
metadata:
  name: source
  namespace: products
spec:
  clusterIP: None
  ports:
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: source
  namespace: products
  labels:
    kubernetes.io/service-name: source
    endpointslice.kubernetes.io/managed-by: dpc-source-e2e
addressType: IPv4
ports:
  - name: https
    protocol: TCP
    port: 443
endpoints:
  - addresses: [source-address-replaced-by-harness]
    conditions:
      ready: true

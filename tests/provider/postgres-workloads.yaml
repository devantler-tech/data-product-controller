apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-query
  namespace: products
  annotations:
    checkov.io/skip1: CKV_K8S_43=The harness substitutes and verifies the immutable fixture digest from its owned disposable registry before applying each model workload.
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres-query }
  template:
    metadata:
      labels: { app: postgres-query, provider-query: postgres }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: query
          image: provider-fixture:immutable
          imagePullPolicy: Always
          args: [postgres-serve]
          env:
            - { name: POSTGRES_MODEL, value: sql }
          ports:
            - containerPort: 8443
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { scheme: HTTPS, path: /healthz, port: 8443 }
            periodSeconds: 3
          livenessProbe:
            httpGet: { scheme: HTTPS, path: /healthz, port: 8443 }
            periodSeconds: 10
          volumeMounts:
            - { name: password, mountPath: /password, readOnly: true }
            - {
                name: stale-password,
                mountPath: /stale-password,
                readOnly: true,
              }
            - { name: database-tls, mountPath: /database-tls, readOnly: true }
            - { name: query-tls, mountPath: /query-tls, readOnly: true }
      volumes:
        - name: password
          secret:
            {
              secretName: warehouse-app,
              items: [{ key: password, path: password }],
            }
        - name: stale-password
          secret: { secretName: warehouse-stale-reader }
        - name: database-tls
          secret:
            { secretName: warehouse-ca, items: [{ key: ca.crt, path: ca.crt }] }
        - name: query-tls
          secret: { secretName: postgres-query-tls }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-query
  namespace: products
spec:
  selector: { app: postgres-query }
  ports: [{ port: 8443, targetPort: 8443 }]
---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-query-ingress
  namespace: products
spec:
  podSelector:
    matchLabels: { provider-query: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: postgres-consumer }
      ports: [{ protocol: TCP, port: 8443 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-writer-ingress
  namespace: products
spec:
  podSelector:
    matchLabels: { app: postgres-writer }
  policyTypes: [Ingress]
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-consumer-ingress
  namespace: products
spec:
  podSelector:
    matchLabels: { app: postgres-consumer }
  policyTypes: [Ingress]
  ingress: []

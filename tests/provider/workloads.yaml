apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-query
  namespace: products
  annotations:
    checkov.io/skip1: CKV_K8S_43=The harness substitutes and verifies the immutable digest pushed to its disposable cluster-local registry before applying this workload.
spec:
  replicas: 1
  selector:
    matchLabels:
      app: document-query
  template:
    metadata:
      labels:
        app: document-query
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: query
          image: provider-fixture:immutable
          imagePullPolicy: Always
          args: [serve]
          env:
            - name: DOCUMENT_USER
              value: catalog-reader
          ports:
            - containerPort: 8443
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: 8443
            periodSeconds: 3
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: 8443
            periodSeconds: 10
          volumeMounts:
            - { name: password, mountPath: /password, readOnly: true }
            - {
                name: stale-password,
                mountPath: /stale-password,
                readOnly: true,
              }
            - { name: database-tls, mountPath: /database-tls, readOnly: true }
            - {
                name: database-client-tls,
                mountPath: /database-client-tls,
                readOnly: true,
              }
            - { name: query-tls, mountPath: /query-tls, readOnly: true }
      volumes:
        - name: password
          secret: { secretName: documents-reader }
        - name: stale-password
          secret: { secretName: documents-stale-reader }
        - name: database-tls
          secret:
            secretName: documents-ssl
            items: [{ key: ca.crt, path: ca.crt }]
        - name: database-client-tls
          secret: { secretName: document-client-tls }
        - name: query-tls
          secret: { secretName: document-query-tls }
---
apiVersion: v1
kind: Service
metadata:
  name: document-query
  namespace: products
spec:
  selector: { app: document-query }
  ports:
    - { port: 8443, targetPort: 8443 }
---
apiVersion: v1
kind: Pod
metadata:
  name: document-writer
  namespace: products
  annotations:
    checkov.io/skip1: CKV_K8S_43=The harness substitutes and verifies the immutable digest pushed to its disposable cluster-local registry before applying this workload.
  labels: { app: document-writer }
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: writer
      image: provider-fixture:immutable
      imagePullPolicy: Always
      args: [serve]
      readinessProbe:
        httpGet: { scheme: HTTPS, path: /healthz, port: 8443 }
        periodSeconds: 3
      livenessProbe:
        httpGet: { scheme: HTTPS, path: /healthz, port: 8443 }
        periodSeconds: 10
      env:
        - { name: DOCUMENT_USER, value: catalog-writer }
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: 500m, memory: 128Mi }
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: [ALL] }
      volumeMounts:
        - { name: password, mountPath: /password, readOnly: true }
        - { name: database-tls, mountPath: /database-tls, readOnly: true }
        - {
            name: database-client-tls,
            mountPath: /database-client-tls,
            readOnly: true,
          }
        - { name: query-tls, mountPath: /query-tls, readOnly: true }
  volumes:
    - name: password
      secret: { secretName: documents-writer }
    - name: database-tls
      secret:
        secretName: documents-ssl
        items: [{ key: ca.crt, path: ca.crt }]
    - name: database-client-tls
      secret: { secretName: document-client-tls }
    - name: query-tls
      secret: { secretName: document-query-tls }
---

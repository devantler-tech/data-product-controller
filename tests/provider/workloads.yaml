apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-query
  namespace: products
spec:
  replicas: 1
  selector:
    matchLabels:
      app: document-query
  template:
    metadata:
      labels:
        app: document-query
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: query
          image: provider-fixture:immutable
          args: [serve]
          env:
            - name: DOCUMENT_USER
              value: catalog-reader
          ports:
            - containerPort: 8443
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: 8443
            periodSeconds: 3
          volumeMounts:
            - {name: password, mountPath: /password, readOnly: true}
            - {name: stale-password, mountPath: /stale-password, readOnly: true}
            - {name: database-tls, mountPath: /database-tls, readOnly: true}
            - {name: query-tls, mountPath: /query-tls, readOnly: true}
      volumes:
        - name: password
          secret: {secretName: documents-reader}
        - name: stale-password
          secret: {secretName: documents-stale-reader}
        - name: database-tls
          secret: {secretName: documents-ssl}
        - name: query-tls
          secret: {secretName: document-query-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: document-query
  namespace: products
spec:
  selector: {app: document-query}
  ports:
    - {port: 8443, targetPort: 8443}
---
apiVersion: v1
kind: Pod
metadata:
  name: document-writer
  namespace: products
  labels: {app: document-writer}
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: writer
      image: provider-fixture:immutable
      args: [serve]
      env:
        - {name: DOCUMENT_USER, value: catalog-writer}
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 500m, memory: 128Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      volumeMounts:
        - {name: password, mountPath: /password, readOnly: true}
        - {name: database-tls, mountPath: /database-tls, readOnly: true}
        - {name: query-tls, mountPath: /query-tls, readOnly: true}
  volumes:
    - name: password
      secret: {secretName: documents-writer}
    - name: database-tls
      secret: {secretName: documents-ssl}
    - name: query-tls
      secret: {secretName: document-query-tls}
---
apiVersion: v1
kind: Pod
metadata:
  name: document-consumer
  namespace: products
  labels: {app: document-consumer}
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: consumer
      image: provider-fixture:immutable
      args: [serve]
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 500m, memory: 128Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      volumeMounts:
        - {name: query-tls, mountPath: /query-tls, readOnly: true}
  volumes:
    - name: query-tls
      secret: {secretName: document-query-tls}

APPLY_FIXES: all
FLAVOR_SUGGESTIONS: false

FILTER_REGEX_EXCLUDE: megalinter-reports/.*
IGNORE_GITIGNORED_FILES: true
EXCLUDED_DIRECTORIES:
  - .git
  - megalinter-reports
  - report
  - .github/prompts
  - .jscpd

DISABLE_LINTERS:
  # MegaLinter's Go flavor pins its own toolchain and runs it with GOTOOLCHAIN=local, so a
  # go.mod directive newer than that toolchain fails package loading outright:
  #   go: go.mod requires go >= 1.26.6 (running go 1.26.3; GOTOOLCHAIN=local)
  # That is a toolchain error, not a lint result, and it masks every real finding. The
  # validate-go-project workflow already runs golangci-lint in its own job with the
  # go.mod toolchain, so this copy is redundant as well as broken.
  - GO_GOLANGCI_LINT
  - GO_REVIVE
  - SPELL_CSPELL

MARKDOWN_MARKDOWNLINT_FILTER_REGEX_EXCLUDE: .github/prompts

# Helm chart templates are Go templates, not YAML documents: yamllint parses `{{- if ... }}`
# as a syntax error, which is a category error rather than a finding. devantler-tech/ksail
# excludes them from the YAML linters for the same reason. Only yamllint needs it here —
# v8r passes and prettier is advisory.
YAML_YAMLLINT_FILTER_REGEX_EXCLUDE: charts/.*/templates/.*
# Helm templates are not plain YAML, while controller-gen output must remain byte-identical across
# its generated and published copies. Format the authored YAML and leave generated artifacts intact.
YAML_PRETTIER_FILTER_REGEX_EXCLUDE: (charts/.*/(templates|crds)/.*|config/(crd/bases|rbac)/.*|deploy/data\.devantler\.tech_dataproducts\.yaml)

# Allow zizmor to use GITHUB_TOKEN so its online audits (e.g. artipacked) can reach the
# GitHub API. Without this, megalinter strips GITHUB_TOKEN and zizmor aborts with
# "fatal: no audit was performed", failing the whole megalinter run.
ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN

# Keep MegaLinter's curated file scope while allowing the current 4.45 percent of repeated test
# fixture setup. A repository config makes jscpd expand into generated YAML and counts the three
# deliberately synchronized CRD copies as 33 percent YAML duplication, so pass only the threshold.
COPYPASTE_JSCPD_ARGUMENTS: --threshold 5

# Trivy's structured ignore format binds each deployment-context exception to its approved artifact.
# The scanner does not discover the YAML variant implicitly, so load it explicitly.
REPOSITORY_TRIVY_ARGUMENTS: --ignorefile .trivyignore.yaml

vulnerabilities:
  - id: GO-2026-5932
    paths:
      - tests/provider/fixture/go.mod
    expired_at: 2026-11-02
    statement: The advisory affects the unused golang.org/x/crypto/openpgp package, with no fixed version. Mandatory fixture dependency tests reject importing that package or any subpackage; govulncheck and OSV compiled-package analysis report no affected packages. This exception applies only to the independent acceptance module and expires for reassessment.
misconfigurations:
  - id: KSV-0113
    paths:
      - docs/examples/sql-provider-observer-rbac.yaml
      - docs/examples/document-provider-observer-rbac.yaml
      - docs/examples/graph-provider-observer-rbac.yaml
      - docs/examples/hybrid-provider-observer-rbac.yaml
    statement: The optional observer needs a whole-Secret get grant for metadata negotiation; the contract test limits each example to its exact named application publications, with no list, watch or mutation.
  - id: KSV-0013
    paths:
      - deploy/deployment.yaml
    statement: The published manifest uses latest only as the tested immutable digest substitution contract.
  - id: KSV-0125
    paths:
      - charts/data-product-controller/templates/controller-deployment.yaml
      - charts/data-product-controller/templates/demo-deployment.yaml
      - deploy/deployment.yaml
    statement: The chart and release contracts constrain workload images to the organization-owned GHCR repository.
  - id: DS-0026
    paths:
      - Dockerfile
    statement: Kubernetes readiness and liveness probes cover both binaries in this multi-entrypoint image.
  - id: DS-0026
    paths:
      - images/postgresql-age/Dockerfile
    statement: CloudNativePG owns PostgreSQL startup and health probes and overrides the image entrypoint. Image acceptance independently starts the server and requires real authenticated queries and authorization denials.
  - id: KSV-0125
    paths:
      - tests/source/consumer.yaml
    statement: The ephemeral test consumes only its checked-out fixture build from the cluster-local registry, replaced with its pushed immutable digest before apply.

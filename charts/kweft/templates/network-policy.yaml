apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kweft.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kweft.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: data-product-controller
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: controller
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: registry
        - port: health
        - port: metrics
{{- if .Values.demoProduct.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kweft.fullname" . }}-harbour
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kweft.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: data-product-controller
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: harbour-product
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
{{- end }}

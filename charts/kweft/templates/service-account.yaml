apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kweft.fullname" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    checkov.io/skip1: CKV_K8S_21=Helm installs this resource into the tested release namespace.
  labels:
    {{- include "kweft.labels" . | nindent 4 }}
automountServiceAccountToken: true

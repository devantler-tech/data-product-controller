{{- if .Values.demoProduct.ksailReleases.enabled }}
{{- $baseURL := .Values.demoProduct.publicBaseURL | default (printf "https://%s/products/harbour" .Values.route.host) }}
apiVersion: data.devantler.tech/v1alpha1
kind: DataProduct
metadata:
  name: ksail-releases
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-product-controller.labels" . | nindent 4 }}
spec:
  id: https://github.com/devantler-tech/ksail/releases
  name: KSail releases
  description: Published KSail versions, release dates and release channels from the public GitHub API.
  version: v1.0.0
  owner:
    name: devantler-tech
    url: https://github.com/devantler-tech/ksail
  documentationUrl: https://github.com/devantler-tech/khoist
  outputs:
    - name: releases
      protocol: OpenAPI
      url: https://api.github.com/repos/devantler-tech/ksail/releases
      contractUrl: {{ printf "%s/ksail-releases/openapi.json" $baseURL | quote }}
      mediaType: application/json
{{- end }}

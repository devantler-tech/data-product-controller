image:
  repository: ghcr.io/devantler-tech/data-product-controller
  # Empty selects the packaged chart appVersion; digest takes precedence.
  tag: ""
  digest: ""
  pullPolicy: Always

registryUI:
  enabled: false

provisionedSources:
  enabled: false

connectorReadiness:
  enabled: false

httpSource:
  enabled: false
  secretName: ""
  sourceCIDR: ""
  consumerPodLabels: {}
  monitorPodLabels: {}
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

route:
  enabled: false
  host: data-products.local
  parentRef:
    name: envoy-gateway
    namespace: envoy-gateway-system
    sectionName: https

controller:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

demoProduct:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      cpu: 50m
      memory: 64Mi

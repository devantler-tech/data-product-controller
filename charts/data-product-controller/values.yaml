image:
  repository: ghcr.io/devantler-tech/data-product-controller
  tag: 0.1.0
  digest: ""
  pullPolicy: Always

registryUI:
  enabled: false

route:
  enabled: false
  host: data-products.local
  parentRef:
    name: envoy-gateway
    namespace: envoy-gateway-system
    sectionName: https

controller:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

demoProduct:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      cpu: 50m
      memory: 64Mi

name: Publish Helm chart

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: publish-chart-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish chart to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read # Checkout the tagged chart source.
      packages: write # Publish the packaged Helm chart to this repository's GHCR namespace.
      id-token: write # Obtain the tagged workflow's keyless signing identity.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Package and publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GHCR_USER" --password-stdin
          printf '%s' "$GHCR_TOKEN" | cosign login ghcr.io --username "$GHCR_USER" --password-stdin
          helm package charts/data-product-controller --version "$version" --app-version "$version"
          push_output=$(helm push "data-product-controller-${version}.tgz" oci://ghcr.io/devantler-tech/charts 2>&1)
          printf '%s\n' "$push_output"
          digest=$(printf '%s\n' "$push_output" | awk '$1 == "Digest:" {print $2}')
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo 'helm push did not return exactly one valid SHA-256 digest' >&2
            exit 1
          fi
          artifact="ghcr.io/devantler-tech/charts/data-product-controller@$digest"
          cosign sign --yes "$artifact"
          cosign verify \
            --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$artifact"

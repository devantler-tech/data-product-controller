name: Release
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

jobs:
  release:
    permissions:
      contents: write # Create the release commit, tag, and GitHub release.
      id-token: write # Mint the reusable workflow's GitHub App identity.
    uses: devantler-tech/.github/.github/workflows/create-release.yaml@2fa404276b0ce5c0527683b080e39045045c4e42 # v7.2.10
    with:
      disable-issue-side-effects: true
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

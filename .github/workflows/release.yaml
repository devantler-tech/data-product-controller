name: Release
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

jobs:
  release:
    permissions:
      contents: write # Create the release commit, tag, and GitHub release.
      id-token: write # Mint the reusable workflow's GitHub App identity.
    uses: devantler-tech/.github/.github/workflows/create-release.yaml@3f78fb69353cadf5cadb970b96d1d6b2aa0fdacb # v7.20.3
    with:
      disable-issue-side-effects: true
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

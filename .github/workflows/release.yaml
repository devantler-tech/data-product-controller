name: Release
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

jobs:
  release:
    permissions:
      contents: write # Create the release commit, tag, and GitHub release.
      id-token: write # Mint the reusable workflow's GitHub App identity.
    uses: devantler-tech/.github/.github/workflows/create-release.yaml@fca583ac795d56928c5b542944b6e0963ea1e270 # v7.8.5
    with:
      disable-issue-side-effects: true
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

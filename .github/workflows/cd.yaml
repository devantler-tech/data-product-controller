---
name: Publish application
on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  publish:
    name: Publish signed image and manifests
    # Reserved image-acceptance tags exercise AGE publication without advancing
    # the controller image or manifest aliases.
    if: ${{ !startsWith(github.ref_name, 'v0.0.0-age-proof.') }}
    permissions:
      contents: read # Checkout the tagged source.
      packages: write # Publish the image and manifest artifact to GHCR.
      id-token: write # Mint the keyless Sigstore signing identity.
    uses: devantler-tech/actions/.github/workflows/publish-app.yaml@1d726483facb9340655489913f609082677be8f5 # v13.10.6
    with:
      app-name: data-product-controller
      enable-caller-pin: true

  publish-age:
    name: Publish signed PostgreSQL AGE image
    permissions:
      contents: read # Build the tagged release source.
      packages: write # Publish only the independently versioned AGE image.
      id-token: write # Sign that artifact with the immutable publisher identity.
    uses: devantler-tech/data-product-controller/.github/workflows/publish-age.yaml@86f0f95e5ac93ec914f5717f561af878b7d09bf1

  smoke:
    name: Verify published offline commands and portable UI host
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout released examples and smoke test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go for the independent report reader
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify and exercise the published image by digest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/devantler-tech/data-product-controller:${RELEASE_TAG#v}"
          docker pull "$image"
          digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          [[ "$digest" =~ ^ghcr.io/devantler-tech/data-product-controller@sha256:[a-f0-9]{64}$ ]]
          cosign verify \
            --certificate-identity https://github.com/devantler-tech/actions/.github/workflows/publish-app.yaml@1d726483facb9340655489913f609082677be8f5 \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository devantler-tech/data-product-controller \
            --certificate-github-workflow-ref "refs/tags/$RELEASE_TAG" \
            --certificate-github-workflow-sha "$EXPECTED_SHA" \
            "$digest"
          [[ "$(docker image inspect "$digest" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" == "$EXPECTED_SHA" ]]
          bash tests/source/dsp-catalog.sh "$digest"
          bash tests/source/ui-kit.sh "$digest"
          bash tests/source/product-check.sh "$digest"

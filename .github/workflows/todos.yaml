      issues: write # Create and update to-do tracking issues (lowercase: the scanner files the uppercase marker).
    uses: devantler-tech/actions/.github/workflows/scan-for-todo-comments.yaml@df7fd4f83edade31c121a9de563d9a7b9b1f900d # v13.10.3
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

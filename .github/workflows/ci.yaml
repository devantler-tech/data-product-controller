---
name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select exact CI coverage
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      profile: ${{ steps.select.outputs.profile }}
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          path: ci-trusted
          persist-credentials: false
      - name: Checkout tested tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ci-trusted/go.mod
          cache: false
      - name: Select from trusted code only
        id: select
        working-directory: ci-trusted
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          profile=full
          if [[ "$EVENT_NAME" == pull_request && -f scripts/ci-plan/main.go ]]; then
            if candidate=$(go run scripts/ci-plan/main.go classify "$GITHUB_WORKSPACE/ci-candidate" "$BASE_SHA" "$TESTED_SHA"); then
              case "$candidate" in
                browser|full) profile="$candidate" ;;
                *) echo '::warning::Classifier output was unknown; retaining full acceptance.' ;;
              esac
            else
              echo '::warning::Classifier failed; retaining full acceptance.'
            fi
          fi
          printf 'profile=%s\n' "$profile" >> "$GITHUB_OUTPUT"
          printf 'CI profile: %s; base=%s; tested=%s\n' "$profile" "$BASE_SHA" "$TESTED_SHA"

  core:
    name: Validate controller, API, chart, and lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run Go tests
        run: go test -race -count=1 ./...

      - name: Build all Go packages
        run: go build ./...

      - name: Validate Go toolchain pins
        run: sh scripts/toolchain.test.sh

      - name: Validate chart behavior
        run: sh scripts/chart.test.sh

      - name: Validate scanner suppression allowlists
        run: sh scripts/scanner-suppressions.test.sh

      - name: Lint Helm chart
        run: helm lint charts/data-product-controller

      - name: Lint Go code
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10.1

  browser:
    name: Validate sandboxed product interaction
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Exercise registry to sandboxed product query
        run: go test -tags=browser ./internal/browser

      - name: Lint the tagged browser tests
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10.1
          args: --build-tags=browser ./internal/browser/...

  release-contract:
    name: Validate release contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate trusted publication path
        run: |
          sh scripts/release.test.sh
          sh scripts/age-release.test.sh
          bash scripts/verify-release-artifacts.test.sh
          bash scripts/observe-rollout.test.sh
          bash tests/source/helm-lifecycle.test.sh
          bash tests/source/suite.test.sh

  source-integration:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.profile != 'browser' }}
    name: Validate Kubernetes lifecycle (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [lifecycle, sql, document, graph]
    # Each hosted job owns its cluster; families retain their eight-minute bounds.
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install verified KSail
        run: |
          curl --fail --location --retry 3 --max-time 180 \
            --output "$RUNNER_TEMP/ksail.tar.gz" \
            https://github.com/devantler-tech/ksail/releases/download/v7.182.6/ksail_7.182.6_linux_amd64.tar.gz
          printf '%s  %s\n' \
            4c1b561c0f4c5cedb3cad5e91a518ccee25d0ced083ce65b290b1c675013d510 \
            "$RUNNER_TEMP/ksail.tar.gz" | sha256sum --check -
          mkdir "$RUNNER_TEMP/ksail-bin"
          tar -xzf "$RUNNER_TEMP/ksail.tar.gz" -C "$RUNNER_TEMP/ksail-bin" ksail
          echo "$RUNNER_TEMP/ksail-bin" >> "$GITHUB_PATH"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Exercise the source-to-registry lifecycle
        env:
          SOURCE_TEST_SUITE: ${{ matrix.suite }}
        run: bash tests/source/run.sh

  percona-acceptance:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.profile != 'browser' }}
    name: Validate native Document queries
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/provider/fixture/go.mod
          cache: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Validate the independent data-plane fixture
        working-directory: tests/provider/fixture
        run: |
          go test -race -count=1 ./...
          go vet ./...

      - name: Install verified KSail
        run: |
          curl --fail --location --retry 3 --max-time 180 \
            --output "$RUNNER_TEMP/ksail.tar.gz" \
            https://github.com/devantler-tech/ksail/releases/download/v7.182.6/ksail_7.182.6_linux_amd64.tar.gz
          printf '%s  %s\n' \
            4c1b561c0f4c5cedb3cad5e91a518ccee25d0ced083ce65b290b1c675013d510 \
            "$RUNNER_TEMP/ksail.tar.gz" | sha256sum --check -
          mkdir "$RUNNER_TEMP/ksail-bin"
          tar -xzf "$RUNNER_TEMP/ksail.tar.gz" -C "$RUNNER_TEMP/ksail-bin" ksail
          echo "$RUNNER_TEMP/ksail-bin" >> "$GITHUB_PATH"

      - name: Exercise real queries, privileges and lifecycle
        # Verify the signed released baseline before comparing the current PR build.
        run: bash tests/provider/percona.sh

  arango-acceptance:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.profile != 'browser' }}
    name: Validate native Graph queries
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/provider/fixture/go.mod
          cache: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Validate the independent data-plane fixture
        working-directory: tests/provider/fixture
        run: |
          go test -race -count=1 ./...
          go vet ./...

      - name: Install verified KSail
        run: |
          curl --fail --location --retry 3 --max-time 180 \
            --output "$RUNNER_TEMP/ksail.tar.gz" \
            https://github.com/devantler-tech/ksail/releases/download/v7.182.6/ksail_7.182.6_linux_amd64.tar.gz
          printf '%s  %s\n' \
            4c1b561c0f4c5cedb3cad5e91a518ccee25d0ced083ce65b290b1c675013d510 \
            "$RUNNER_TEMP/ksail.tar.gz" | sha256sum --check -
          mkdir "$RUNNER_TEMP/ksail-bin"
          tar -xzf "$RUNNER_TEMP/ksail.tar.gz" -C "$RUNNER_TEMP/ksail-bin" ksail
          echo "$RUNNER_TEMP/ksail-bin" >> "$GITHUB_PATH"

      - name: Exercise real graph traversal, privileges and lifecycle
        run: bash tests/provider/arango.sh
  age-image:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.profile != 'browser' }}
    name: Validate PostgreSQL AGE image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the verified extension and exercise real queries
        run: |
          set -euo pipefail
          sh scripts/age-release.test.sh
          docker build --pull --file images/postgresql-age/Dockerfile --tag dpc-age:acceptance images/postgresql-age
          docker run --rm --user 26 --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges --memory 512m --cpus 2 --tmpfs /tmp:rw,size=128m \
            --mount "type=bind,source=$PWD/tests/provider,target=/acceptance,readonly" \
            --entrypoint /bin/bash dpc-age:acceptance /acceptance/age-image-bootstrap.sh

  required-checks:
    name: CI - Required Checks
    needs:
      [
        plan,
        core,
        browser,
        release-contract,
        source-integration,
        percona-acceptance,
        arango-acceptance,
        age-image,
        postgres-acceptance,
      ]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted result checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          path: ci-trusted
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ci-trusted/go.mod
          cache: false
      - name: Require every selected job and every declared result
        env:
          PROFILE: ${{ needs.plan.outputs.profile }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if [[ -f ci-trusted/scripts/ci-plan/main.go ]]; then
            go run ci-trusted/scripts/ci-plan/main.go check "$PROFILE"
          else
            # The first classifier PR has no checker at main yet. Bootstrap
            # accepts the complete suite only, with an exact job inventory.
            [[ "$PROFILE" == full ]]
            jq -e 'keys == ["age-image","arango-acceptance","browser","core","percona-acceptance","plan","postgres-acceptance","release-contract","source-integration"] and all(.[]; .result == "success") and .plan.outputs.profile == "full"' <<< "$NEEDS_JSON"
          fi

  postgres-acceptance:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.profile != 'browser' }}
    name: Validate SQL, JSONB and AGE queries
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/provider/fixture/go.mod
          cache: false
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Validate the independent data-plane fixture
        working-directory: tests/provider/fixture
        run: |
          go test -race -count=1 ./...
          go vet ./...
      - name: Install verified KSail
        run: |
          curl --fail --location --retry 3 --max-time 180 \
            --output "$RUNNER_TEMP/ksail.tar.gz" \
            https://github.com/devantler-tech/ksail/releases/download/v7.182.6/ksail_7.182.6_linux_amd64.tar.gz
          printf '%s  %s\n' \
            4c1b561c0f4c5cedb3cad5e91a518ccee25d0ced083ce65b290b1c675013d510 \
            "$RUNNER_TEMP/ksail.tar.gz" | sha256sum --check -
          mkdir "$RUNNER_TEMP/ksail-bin"
          tar -xzf "$RUNNER_TEMP/ksail.tar.gz" -C "$RUNNER_TEMP/ksail-bin" ksail
          echo "$RUNNER_TEMP/ksail-bin" >> "$GITHUB_PATH"
      - name: Exercise three real PostgreSQL data models
        run: bash tests/provider/postgres.sh

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: export-connector-observer
  namespace: products
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [export-http-source]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: export-connector-observer
  namespace: products
subjects:
  - kind: ServiceAccount
    name: data-product-controller
    namespace: data-product-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: export-connector-observer

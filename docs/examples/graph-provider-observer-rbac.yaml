apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lineage-observer
  namespace: products
rules:
  - apiGroups: [database.arangodb.com]
    resources: [arangodeployments]
    resourceNames: [lineage]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [lineage-reader]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lineage-observer
  namespace: products
subjects:
  - kind: ServiceAccount
    name: data-product-controller
    namespace: data-product-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lineage-observer

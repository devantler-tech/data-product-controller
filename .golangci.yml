version: "2"
run:
  allow-parallel-runners: true
  modules-download-mode: readonly
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
    - swaggo
linters:
  # Keep this list explicit: these checks target defects that can crash the
  # controller, corrupt API responses, or weaken its network boundary. The
  # Kubernetes API conventions deliberately use package globals and init
  # registration, so enabling every stylistic linter is not meaningful here.
  default: none
  enable:
    - asasalint
    - bodyclose
    - contextcheck
    - copyloopvar
    - depguard
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - gocritic
    - gosec
    - govet
    - ineffassign
    - makezero
    - nilerr
    - noctx
    - protogetter
    - reassign
    - recvcheck
    - staticcheck
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - wastedassign
  exclusions:
    warn-unused: true
  settings:
    depguard:
      rules:
        main:
          files:
            - "$all"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            # The trusted-base CI selector parses test syntax without executing it.
            - go/parser$
            - go/token$
            - github.com/devantler-tech/data-product-controller
            # Pinned API serialization supplies the ArangoDB specification checksum;
            # no operator runtime or database client is instantiated.
            - github.com/arangodb/kube-arangodb/pkg/apis/deployment/v1$
            # Portable runtime flag API — the feature-flag-first delivery
            # convention (see AGENTS.md ## Maintenance). Swap the provider for
            # flagd / a managed backend in a real service; call sites are stdlib.
            - github.com/open-feature/go-sdk
            # Standard metrics for the isolated source connector.
            - github.com/prometheus/client_golang
            # Gatherer serialization keeps readiness and observation time coherent.
            - github.com/prometheus/client_model/go$
            # Kubernetes API machinery and the controller-runtime are the
            # control plane's deliberately narrow runtime dependencies.
            - k8s.io/apimachinery
            # The deployment/v1 connector contract observes the typed workload status.
            - k8s.io/api/apps/v1$
            - k8s.io/client-go
            - sigs.k8s.io/controller-runtime
            # Offline publisher validation embeds the delivered schema and runs its rules;
            # these packages instantiate no API server or network client.
            - k8s.io/apiextensions-apiserver/pkg/apis/apiextensions
            - k8s.io/apiextensions-apiserver/pkg/apiserver/schema
            - k8s.io/apiextensions-apiserver/pkg/apiserver/validation$
            - k8s.io/apiserver/pkg/apis/cel$
            # Match Kubernetes YAML 1.1 scalar decoding after v3 syntax guards.
            - go.yaml.in/yaml/v2$
            - go.yaml.in/yaml/v3$
            - sigs.k8s.io/yaml$
            # Match Kubernetes's case-sensitive strict JSON fields, including metadata.
            - sigs.k8s.io/json$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

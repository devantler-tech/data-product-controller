version: "2"
run:
  allow-parallel-runners: true
  modules-download-mode: readonly
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
    - swaggo
linters:
  # Keep this list explicit: these checks target defects that can crash the
  # controller, corrupt API responses, or weaken its network boundary. The
  # Kubernetes API conventions deliberately use package globals and init
  # registration, so enabling every stylistic linter is not meaningful here.
  default: none
  enable:
    - asasalint
    - bodyclose
    - contextcheck
    - copyloopvar
    - depguard
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - gocritic
    - gosec
    - govet
    - ineffassign
    - makezero
    - nilerr
    - noctx
    - protogetter
    - reassign
    - recvcheck
    - staticcheck
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - wastedassign
  exclusions:
    warn-unused: true
  settings:
    depguard:
      rules:
        main:
          files:
            - "$all"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/devantler-tech/data-product-controller
            # Portable runtime flag API — the feature-flag-first delivery
            # convention (see AGENTS.md ## Maintenance). Swap the provider for
            # flagd / a managed backend in a real service; call sites are stdlib.
            - github.com/open-feature/go-sdk
            # Kubernetes API machinery and the controller-runtime are the
            # control plane's deliberately narrow runtime dependencies.
            - k8s.io/apimachinery
            - k8s.io/client-go
            - sigs.k8s.io/controller-runtime
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
